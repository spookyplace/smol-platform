# Values for the backstage/charts `backstage` chart (ADR-0003).
# Environment-specific Backstage config lives here (appConfig); the image stays environment-agnostic.
# No secrets in this file: appConfig only references env vars, which come from Kubernetes Secrets.
backstage:
  image:
    registry: ghcr.io
    repository: spookyplace/smol-backstage
    # The smol-backstage commit CI built it from (for humans); the digest is what's pulled (the chart prefers it).
    # A CI re-run on the same commit overwrites the tag, never the digest. Bump both together.
    tag: 03be8f7122223408305b43e56914ddb7a11f7c99
    digest: sha256:b5c41df71986c8ae73ba475ae16074a799f880ce4fc198ce1ab08aae7bff2490

  # The image's own config files; the chart appends --config for the appConfig ConfigMap after these
  args: ["--config", "app-config.yaml", "--config", "app-config.production.yaml"]

  extraEnvVars:
    # Generated by CloudNativePG for the backstage-db Cluster (gitops/backstage/manifests/postgres.yaml)
    - name: POSTGRES_HOST
      valueFrom: {secretKeyRef: {name: backstage-db-app, key: host}}
    - name: POSTGRES_PORT
      valueFrom: {secretKeyRef: {name: backstage-db-app, key: port}}
    - name: POSTGRES_USER
      valueFrom: {secretKeyRef: {name: backstage-db-app, key: username}}
    - name: POSTGRES_PASSWORD
      valueFrom: {secretKeyRef: {name: backstage-db-app, key: password}}
  # GITHUB_APP_ID, GITHUB_APP_CLIENT_ID, GITHUB_APP_PRIVATE_KEY, GITHUB_APP_CLIENT_SECRET (`make backstage-secrets`)
  extraEnvVarsSecrets: [backstage-github-app]

  extraVolumes:
    # CNPG's CA, so Backstage verifies the Postgres server certificate
    - name: db-ca
      secret: {secretName: backstage-db-ca, items: [{key: ca.crt, path: ca.crt}]}
    # Writable /tmp for a read-only root filesystem (scaffolder workspaces, TechDocs builds)
    - name: tmp
      emptyDir: {}
  extraVolumeMounts:
    - {name: db-ca, mountPath: /etc/backstage-db-ca, readOnly: true}
    - {name: tmp, mountPath: /tmp}

  # Pod Security Standards "restricted" (enforced by Kyverno in Phase 4)
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile: {type: RuntimeDefault}
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities: {drop: [ALL]}

  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {memory: 1Gi}

  appConfig:
    app:
      title: Smol
      # Phase 1: reached through kubectl port-forward (Istio Gateway in Phase 2)
      baseUrl: http://localhost:7007
    organization:
      name: Smol
    backend:
      baseUrl: http://localhost:7007
      database:
        # One database, one schema per plugin: the `backstage` role needs no CREATEDB
        pluginDivisionMode: schema
        ensureSchemaExists: true
        connection:
          # CNPG serves TLS by default; verify it against CNPG's CA
          ssl:
            rejectUnauthorized: true
            ca:
              $file: /etc/backstage-db-ca/ca.crt
    integrations:
      github:
        - host: github.com
          apps:
            - appId: ${GITHUB_APP_ID}
              clientId: ${GITHUB_APP_CLIENT_ID}
              clientSecret: ${GITHUB_APP_CLIENT_SECRET}
              privateKey: ${GITHUB_APP_PRIVATE_KEY}
              # Only use installations in our org
              allowedInstallationOwners: [spookyplace]
    auth:
      providers:
        guest:
          # Phase 1 only (ADR-0003): local cluster, port-forward access. Replaced by GitHub sign-in in Phase 2 (O7).
          dangerouslyAllowOutsideDevelopment: true
    catalog:
      # Replaces the image's example locations. Read through the GitHub App, which proves the integration works.
      locations:
        - type: url
          target: https://github.com/spookyplace/smol-backstage/blob/main/catalog-info.yaml

serviceAccount:
  create: true
  # Backstage doesn't call the Kubernetes API yet (the Kubernetes plugin is unconfigured)
  automountServiceAccountToken: false
