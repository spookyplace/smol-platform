# Values for the argo/argo-cd chart. Used by both `make argocd` and gitops/apps/argocd.yaml (ADR-0002).
# Chart defaults: https://github.com/argoproj/argo-helm/blob/main/charts/argo-cd/values.yaml

# No SSO yet: the admin user, at http://argocd.localhost:8080 (see docs/security.md)
dex:
  enabled: false

# Nothing sends notifications yet
notifications:
  enabled: false

configs:
  # TLS ends at the Istio Gateway (ADR-0004); the gateway → argocd-server hop is in-cluster
  params:
    server.insecure: true
  cm:
    # External URL, used for SSO callbacks and links (chart default: https://<global.domain>)
    url: http://argocd.localhost:8080
  # Clusters by role (ADR-0002). Workload apps target `destination.name: products`, never a server URL.
  # Today `products` is this cluster, so it renames ArgoCD's `in-cluster` entry; platform apps use
  # `server: https://kubernetes.default.svc` instead. A separate cluster later changes only `server` and `config` here.
  clusterCredentials:
    products:
      server: https://kubernetes.default.svc
      config: {}
