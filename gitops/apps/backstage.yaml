# Backstage (ADR-0003), a platform app: the chart, its values, and its CNPG database (sync wave -1).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backstage
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://backstage.github.io/charts
      chart: backstage
      # Must equal BACKSTAGE_CHART_VERSION in versions.env
      targetRevision: 2.10.2
      helm:
        releaseName: backstage
        valueFiles:
          - $values/gitops/backstage/values.yaml
    - repoURL: https://github.com/spookyplace/smol-platform.git
      targetRevision: main
      ref: values
    # Plain manifests: the Postgres Cluster
    - repoURL: https://github.com/spookyplace/smol-platform.git
      targetRevision: main
      path: gitops/backstage/manifests
  destination:
    # Platform app: ArgoCD's own cluster (ADR-0002)
    server: https://kubernetes.default.svc
    namespace: backstage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # The namespace usually exists already (`make backstage-secrets` creates it for the GitHub App Secret)
      - CreateNamespace=true
    # Labels ArgoCD sets on the namespace (needs CreateNamespace=true), existing or not. Not a Namespace manifest:
    # that would make the app own the namespace, and deleting the app would delete it with the database and Secret.
    managedNamespaceMetadata:
      labels:
        # Istio ambient (ADR-0004): ztunnel gives every pod here L4 mTLS; running pods are enrolled without a restart
        istio.io/dataplane-mode: ambient
    # On a fresh cluster, root creates this app and cloudnative-pg together, so the Cluster CRD may not exist yet.
    # Waves can't order sibling apps (ArgoCD doesn't assess Application health by default); retrying until it exists can.
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
