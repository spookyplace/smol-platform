# Root of the app-of-apps (ADR-0002). Every file in gitops/apps/ is a child Application, this one included:
# root manages itself, so changes here sync from git. `make argocd` applies it only to bootstrap or recover.
# No resources-finalizer: deleting this Application leaves its children (and ArgoCD) running.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/spookyplace/smol-platform.git
    targetRevision: main
    path: gitops/apps
  destination:
    # Platform app: ArgoCD's own cluster, by URL (`in-cluster` is renamed to `products`; see values.yaml)
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
